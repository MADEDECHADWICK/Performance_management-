name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: ronalds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d ronalds_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/ronalds_test
      DIRECT_DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/ronalds_test
      JWT_SECRET: test-secret
      NODE_ENV: test
      PORT: 4000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.2
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint --if-present
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ronalds-growth-hub/package-lock.json

      - name: Install root test runner
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ronalds-growth-hub

      - name: Frontend smoke tests
        run: npm run test:frontend-smoke

      - name: Frontend UI smoke tests
        run: npm run test:frontend-ui

      - name: Frontend lint
        run: npm run lint --if-present
        working-directory: ronalds-growth-hub

      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: ronalds-growth-hub

      - name: Frontend build
        run: npm run build
        working-directory: ronalds-growth-hub
